##### ============================
#####  Prefix и базовая настройка
##### ============================
set -g prefix C-j
unbind C-b
bind C-j send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 5000
setw -g mode-keys vi

##### ============================
#####  Terminal (совместимость)
##### ============================
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:RGB,alacritty:RGB"

set -sg escape-time 0

# Доп. опции
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g allow-rename off
setw -g automatic-rename off
# При разных размерах клиентов можно поставить aggressive-resize off
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string "#I:#W"


##### ============================
#####  Окна и панели (опции)
##### ============================
# (base-index, history, mouse — выше)


##### ============================
#####  Бинды окон и панелей
##### ============================
# M-[ / M-] — навигация по окнам (безопасная замена C-[/C-])
# prefix+n — следующее окно, p — предыдущее
# C-u — merge-session (с подтверждением), F12 — nesting, L — link-window
# \ — swap с первой панелью, C-s — статус вкл/выкл, m/M — monitor activity/silence
# P — вставка из системного буфера (paste.sh), C-p — choose-buffer

unbind c
bind c new-window -c "#{pane_current_path}"
bind-key x kill-pane

bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind R command-prompt -I "#{session_name}" "rename-session '%%'"
bind C-r source-file ~/.tmux.conf \; display "Reloaded!"

bind C-e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"Config reloaded\"'"

unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

bind -r M-[ previous-window
bind -r M-] next-window
bind n next-window
bind p previous-window
bind -r [ select-pane -t :.-
bind -r ] select-pane -t :.+
bind -r Tab last-window
bind -r C-o swap-pane -D
bind + resize-pane -Z

bind L command-prompt -p "Link window from (session:window): " "link-window -s %% -a"

bind \\ if '[ #{pane_index} -eq 1 ]' \
     'swap-pane -s "!"' \
     'select-pane -t:.1 ; swap-pane -d -t 1 -s "!"'

bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Merge session: перенос текущего окна в указанную сессию (безопасно, по одному окну)
bind C-u command-prompt -p "Session to merge with: " "move-window -t %%"

bind d detach
bind D if -F '#{session_many_attached}' \
    'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
    'display "Session has only 1 client attached"'

bind C-s if -F '#{s/off//:status}' 'set status off' 'set status on'

bind m setw monitor-activity \; display-message 'Monitor window activity [#{?monitor-activity,ON,OFF}]'
bind M if -F '#{monitor-silence}' \
    'setw monitor-silence 0 ; display-message "Monitor window silence [OFF]"' \
    'command-prompt -p "Monitor silence: interval (s)" "setw monitor-silence %%"'
set -g visual-activity on


##### ============================
#####  Copy-mode и yank (в системный буфер: ~/.tmux/yank.sh / OSC52)
##### ============================
set -g @copy_use_osc52_fallback on

bind y copy-mode
bind p previous-window
bind C-p choose-buffer

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$HOME/.tmux/yank.sh"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$HOME/.tmux/yank.sh"
bind -T copy-mode-vi Y send-keys -X copy-line \; run "tmux save-buffer - | $HOME/.tmux/yank.sh"
bind -T copy-mode-vi D send-keys -X copy-end-of-line \; run "tmux save-buffer - | $HOME/.tmux/yank.sh"
bind -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel "$HOME/.tmux/yank.sh"
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "$HOME/.tmux/yank.sh"
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

bind -n M-Up copy-mode
bind -T copy-mode-vi M-Up    send-keys -X scroll-up
bind -T copy-mode-vi M-Down  send-keys -X scroll-down
bind -T copy-mode-vi M-PageUp   send-keys -X halfpage-up
bind -T copy-mode-vi M-PageDown send-keys -X halfpage-down
bind -T copy-mode-vi PageDown send-keys -X page-down
bind -T copy-mode-vi PageUp   send-keys -X page-up
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

bind P run-shell '"$HOME/.tmux/paste.sh" | tmux load-buffer - && tmux paste-buffer'


##### ============================
#####  Renew environment (DISPLAY, SSH_AUTH_SOCK и т.д.)
##### ============================
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY WINDOWID XAUTHORITY"
bind '$' run "~/.tmux/renew_env.sh"


##### ============================
#####  Оформление (Tokyo Night) и статус-бар
##### ============================
set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g status-style "fg=#a9b1d6,bg=#1a1b26"
set -g status-interval 8

# Значения для восстановления после nesting (F12) — единый источник для restore
set -g @nest_restore_prefix "C-j"
set -g @nest_restore_status_style "fg=#a9b1d6,bg=#1a1b26"
set -g @nest_restore_window_status_current_format "#[fg=#1a1b26,bg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7] #I: #W #[fg=#7aa2f7,bg=#1a1b26]"
set -g @nest_restore_window_status_current_style "fg=#1a1b26,bold,bg=#7aa2f7"

set -g status-position bottom
set -g status-justify centre

# Вызовы #( ) только напрямую в status-right: tmux не раскрывает #( ) после подстановки пользовательской опции
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1a1b26,nobold]"
set -g status-right "#[fg=#e0af68,bg=#1a1b26]#[fg=#1a1b26,bg=#7aa2f7]  #( ~/.tmux/scripts/cpu.sh ) #[fg=#bb9af7,bg=#1a1b26] #( ~/.tmux/scripts/cpu_temp.sh )#[fg=#7dcfff,bg=#1a1b26] #( ~/.tmux/scripts/mem.sh )#[fg=#9ece6a,bg=#1a1b26] #( ~/.tmux/scripts/net.sh )"

set -g window-status-format "#[fg=#a9b1d6,bg=#1a1b26] #I: #W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7] #I: #W #[fg=#7aa2f7,bg=#1a1b26]"

# Переменные для tmux.remote.conf (оформление при SSH)
set -g @wg_session "#[fg=#1a1b26,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1a1b26,nobold]"
set -g @wg_is_zoomed "#[fg=#e0af68,bg=#1a1b26]#{?window_zoomed_flag,[Z],}"
set -g @wg_is_keys_off "#[fg=#a9b1d6,bg=#f7768e]#([ $(tmux show-option -qv key-table) = 'off' ] && echo 'OFF')#[default]"
set -g @wg_user_host "#[fg=#a9b1d6,bg=#1a1b26]#(whoami)#[default]@#H"


##### ============================
#####  Плагины (TPM; sensible удалён — нужные опции в конфиге)
##### ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'

set -g @color_dark "#1a1b26"
set -g @color_secondary "#7aa2f7"
set -g @prefix_highlight_output_prefix '['
set -g @prefix_highlight_output_suffix ']'
set -g @prefix_highlight_fg "#{@color_dark}"
set -g @prefix_highlight_bg "#{@color_secondary}"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=#{@color_dark},bg=#{@color_secondary}"

set -g @sysstat_cpu_color_low "green"
set -g @sysstat_cpu_color_medium "yellow"
set -g @sysstat_cpu_color_stress "red"
set -g @sysstat_mem_color_low "green"
set -g @sysstat_mem_color_medium "yellow"
set -g @sysstat_mem_color_stress "red"
set -g @sysstat_swap_color_low "green"
set -g @sysstat_swap_color_medium "yellow"
set -g @sysstat_swap_color_stress "red"

set -g @batt_color_full_charge "#[fg=green]"
set -g @batt_color_high_charge "#[fg=green]"
set -g @batt_color_medium_charge "#[fg=yellow]"
set -g @batt_color_low_charge "#[fg=red]"

set -g @sidebar-tree 't'
set -g @sidebar-tree-focus 'T'
set -g @sidebar-tree-command 'tree -C'
set -g @open-S 'https://www.google.com/search?q='


##### ============================
#####  Nesting: F12 — отключение биндов локального tmux (вложенная сессия)
#####  При выходе (F12 в key-table off) восстанавливаем из @nest_restore_* (Tokyo Night).
##### ============================
set -g @nest_off_bg "#3b4261"
set -g @nest_off_current_bg "#a9b1d6"

bind -T root F12 \
    set prefix None \; \
    set key-table off \; \
    set status-style "fg=#a9b1d6,bg=#{@nest_off_bg}" \; \
    set window-status-current-format "#[fg=#{@nest_off_bg},bg=#{@nest_off_current_bg}] #I: #W# #[fg=#{@nest_off_current_bg},bg=#{@nest_off_bg}]" \; \
    set window-status-current-style "fg=#1a1b26,bold,bg=#{@nest_off_current_bg}" \; \
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
    refresh-client -S

bind -T off F12 \
    set -g prefix "#{@nest_restore_prefix}" \; \
    set -u key-table \; \
    set -g status-style "#{@nest_restore_status_style}" \; \
    set -g window-status-current-format "#{@nest_restore_window_status_current_format}" \; \
    set -g window-status-current-style "#{@nest_restore_window_status_current_style}" \; \
    refresh-client -S


##### ============================
#####  Удалённая сессия (SSH): ~/.tmux/tmux.remote.conf
##### ============================
if-shell 'test -n "$SSH_TTY"' 'source-file ~/.tmux/tmux.remote.conf'


##### ============================
#####  Запуск TPM
##### ============================
run '~/.tmux/plugins/tpm/tpm'
