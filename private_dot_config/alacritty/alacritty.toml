[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[window]
startup_mode = "Maximized"
decorations = "Full"
resize_increments = false
padding = { x = 8, y = 6 }
dynamic_title = true
opacity = 0.92
blur = true

[scrolling]
history = 50000
multiplier = 3

[font]
size = 17.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }

[colors.primary]
background = "#0f0f0f"
foreground = "#e5e5e5"

[colors.cursor]
cursor = "#ffffff"
text = "#000000"

[colors.selection]
background = "#3a3f4b"
text = "CellForeground"

[colors.normal]
black   = "#1e1e1e"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#dcdcdc"

[colors.bright]
black   = "#5c6370"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#ffffff"

[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },

  { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control", action = "ResetFontSize" }
]
