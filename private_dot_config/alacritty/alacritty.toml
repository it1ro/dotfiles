[env]
TERM = "xterm-256color"

[window]
# Критично: НЕ fullscreen, НЕ borderless fullscreen
startup_mode = "Maximized"
decorations = "None"

# Можно оставить, если нравится
resize_increments = true
padding = { x = 0, y = 0 }
dynamic_title = true

# Лёгкая прозрачность окна.
# Нужна для того, чтобы держать браузер и терминал на одном экране:
# читаю документацию или код в браузере → печатаю команды в Alacritty,
# при этом фон слегка просвечивает, но текст остаётся полностью читаемым.
opacity = 0.94

# Если включён blur в GNOME/KDE, прозрачность становится мягкой и не мешает глазам.
# Без blur тоже работает, но blur делает фон более однородным.
blur = true

[scrolling]
history = 100000
multiplier = 3

[font]
size = 17.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }

[colors.primary]
background = "#0f0f0f"
foreground = "#e5e5e5"

[colors.cursor]
cursor = "#ffffff"
text = "#000000"

[colors.selection]
background = "#44475a"
text = "CellForeground"

[colors.normal]
black   = "#1e1e1e"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#dcdcdc"

[colors.bright]
black   = "#5c6370"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#ffffff"

[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" }
]
